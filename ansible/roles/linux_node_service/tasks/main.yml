---
- name: Normalize Linux service manager
  ansible.builtin.set_fact:
    node_deploy_linux_service_manager_normalized: "{{ node_deploy_linux_service_manager | default('systemd') | lower | regex_replace('_', '-') }}"
    node_deploy_linux_reverse_proxy_normalized: "{{ node_deploy_linux_reverse_proxy | default('none') | lower | regex_replace('_', '-') }}"
    node_deploy_app_runtime_normalized: "{{ node_deploy_app_runtime | default('node') | lower | regex_replace('_', '-') }}"
    node_deploy_app_framework_normalized: "{{ node_deploy_app_framework | default('nextjs') | lower | regex_replace('_', '-') }}"
    node_deploy_nextjs_deployment_mode_normalized: "{{ node_deploy_nextjs_deployment_mode | default('standalone') | lower | regex_replace('_', '-') }}"

- name: Validate Linux service manager
  ansible.builtin.fail:
    msg: "Unsupported node_deploy_linux_service_manager={{ node_deploy_linux_service_manager }}. Use systemd, systemv, openrc, launchd, or bsdrc."
  when: node_deploy_linux_service_manager_normalized not in ['systemd', 'systemv', 'sysv', 'sysvinit', 'initd', 'init-d', 'openrc', 'launchd', 'bsdrc', 'bsd-rc', 'rcd', 'rc.d']

- name: Validate Linux reverse proxy
  ansible.builtin.fail:
    msg: "Unsupported node_deploy_linux_reverse_proxy={{ node_deploy_linux_reverse_proxy }}. Use nginx, apache, haproxy, traefik, or none."
  when: node_deploy_linux_reverse_proxy_normalized not in ['nginx', 'apache', 'httpd', 'haproxy', 'traefik', 'none', '']

- name: Validate application runtime
  ansible.builtin.fail:
    msg: "Unsupported node_deploy_app_runtime={{ node_deploy_app_runtime | default('node') }}. Use node or tomcat."
  when: node_deploy_app_runtime_normalized not in ['node', 'tomcat', 'apache-tomcat']

- name: Validate application framework
  ansible.builtin.fail:
    msg: "Unsupported node_deploy_app_framework={{ node_deploy_app_framework | default('nextjs') }}. Use node, nextjs, or reactjs."
  when: node_deploy_app_framework_normalized not in ['node', 'next', 'nextjs', 'next-js', 'react', 'reactjs', 'react-js']

- name: Validate Next.js runtime selection
  ansible.builtin.fail:
    msg: "APP_FRAMEWORK=nextjs requires node_deploy_app_runtime=node."
  when:
    - node_deploy_app_framework_normalized in ['next', 'nextjs', 'next-js']
    - node_deploy_app_runtime_normalized != 'node'

- name: Validate Next.js deployment mode
  ansible.builtin.fail:
    msg: "Unsupported node_deploy_nextjs_deployment_mode={{ node_deploy_nextjs_deployment_mode | default('standalone') }}. Use standalone or next-start."
  when:
    - node_deploy_app_framework_normalized in ['next', 'nextjs', 'next-js']
    - node_deploy_nextjs_deployment_mode_normalized not in ['standalone', 'next-start']

- name: Validate React runtime selection
  ansible.builtin.fail:
    msg: "APP_FRAMEWORK=reactjs requires node_deploy_app_runtime=node."
  when:
    - node_deploy_app_framework_normalized in ['react', 'reactjs', 'react-js']
    - node_deploy_app_runtime_normalized != 'node'

- name: Resolve incoming Linux deployment config path
  ansible.builtin.set_fact:
    node_deploy_linux_incoming_config_path: >-
      {{ '/etc/node-enterprise-deploy-kit/incoming/' ~ node_deploy_project_name ~ '.env'
         if (node_deploy_linux_config_path | default('/etc/node-enterprise-deploy-kit/incoming/' ~ node_deploy_project_name ~ '.env', true) | normpath)
            == (('/etc/node-enterprise-deploy-kit/' ~ node_deploy_project_name ~ '.env') | normpath)
         else (node_deploy_linux_config_path | default('/etc/node-enterprise-deploy-kit/incoming/' ~ node_deploy_project_name ~ '.env', true)) }}

- name: Ensure Linux deployment support directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ node_deploy_linux_deploy_dir }}"
    - "{{ node_deploy_linux_deploy_dir }}/scripts/linux"
    - "{{ node_deploy_linux_deploy_dir }}/templates/linux"
    - "{{ node_deploy_linux_deploy_dir }}/config"
    - "{{ node_deploy_linux_incoming_config_path | dirname }}"

- name: Resolve native root group
  ansible.builtin.command:
    argv: [id, -gn, root]
  register: node_deploy_native_root_group
  changed_when: false
  check_mode: false

- name: Copy Linux deployment entrypoint
  ansible.builtin.copy:
    src: "../../../../deploy.sh"
    dest: "{{ node_deploy_linux_deploy_dir }}/deploy.sh"
    mode: "0755"

- name: Copy Linux deployment scripts
  ansible.builtin.copy:
    src: "../../../../scripts/linux/"
    dest: "{{ node_deploy_linux_deploy_dir }}/scripts/linux/"
    mode: "0755"
    directory_mode: "0755"

- name: Copy Linux templates
  ansible.builtin.copy:
    src: "../../../../templates/linux/"
    dest: "{{ node_deploy_linux_deploy_dir }}/templates/linux/"
    mode: "0644"
    directory_mode: "0755"

- name: Copy reviewed Node runtime policy
  ansible.builtin.copy:
    src: "../../../../config/node-runtime-policy.json"
    dest: "{{ node_deploy_linux_deploy_dir }}/config/node-runtime-policy.json"
    owner: root
    group: "{{ node_deploy_native_root_group.stdout | trim }}"
    mode: "0644"

- name: Render Linux deployment config
  ansible.builtin.template:
    src: deploy.env.j2
    dest: "{{ node_deploy_linux_incoming_config_path }}"
    owner: root
    group: "{{ node_deploy_native_root_group.stdout | trim }}"
    mode: "0640"
  no_log: true

- name: Optionally install Linux dependencies
  ansible.builtin.command:
    argv:
      - bash
      - "{{ node_deploy_linux_deploy_dir }}/scripts/linux/install-dependencies.sh"
      - "{{ node_deploy_linux_incoming_config_path }}"
  when:
    - node_deploy_linux_install_dependencies | default(false) | bool
    - ansible_facts.system != 'Darwin'
  become: true
  changed_when: true

- name: Optionally install macOS dependencies with Homebrew
  ansible.builtin.command:
    argv:
      - bash
      - "{{ node_deploy_linux_deploy_dir }}/scripts/linux/install-dependencies.sh"
  environment:
    REVERSE_PROXY: "{{ node_deploy_linux_reverse_proxy | default('none') }}"
    APP_RUNTIME: "{{ node_deploy_app_runtime | default('node') }}"
    NGINX_PACKAGE: "{{ node_deploy_linux_nginx_package | default('nginx') }}"
    APACHE_PACKAGE: "{{ node_deploy_linux_apache_package | default('httpd', true) }}"
    HAPROXY_PACKAGE: "{{ node_deploy_linux_haproxy_package | default('haproxy') }}"
    TRAEFIK_PACKAGE: "{{ node_deploy_linux_traefik_package | default('traefik') }}"
    TOMCAT_PACKAGE: "{{ node_deploy_tomcat_package | default('tomcat', true) }}"
  when:
    - node_deploy_linux_install_dependencies | default(false) | bool
    - ansible_facts.system == 'Darwin'
  become: false
  changed_when: true

- name: Deploy Linux Node app using local orchestrator
  ansible.builtin.command:
    argv:
      - bash
      - "{{ node_deploy_linux_deploy_dir }}/deploy.sh"
      - "{{ node_deploy_linux_incoming_config_path }}"
  changed_when: true
