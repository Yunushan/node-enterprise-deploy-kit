version: 2

updates:
  - package-ecosystem: npm
    directory: /tests/fixtures/nextjs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nextjs-fixture:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@next/*"
  - package-ecosystem: pip
    directory: /scripts/dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
